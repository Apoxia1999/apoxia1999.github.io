<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Apoxia Toolkit. Herramientas y utilidades." data-i18n-content="homeDescription">
  <title>Apoxia Toolkit</title>
  <link rel="stylesheet" href="assets/styles.css?v=i18n">
  <script src="assets/i18n.js?v=3.0" defer></script>
</head>
<body>
  <main>
    <header class="page-header">
      <h1>Apoxia Toolkit</h1>
      <div class="language-switch" role="group" aria-label="Idioma" data-i18n-aria-label="language" hidden>
        <button type="button" data-language="es" lang="es" aria-label="Español" aria-pressed="true">ES</button>
        <button type="button" data-language="en" lang="en" aria-label="English" aria-pressed="false">EN</button>
      </div>
    </header>
    <div class="grid">
      <a class="card tool" href="houdini-node-copypaster/">
        <img class="cover" src="assets/houdini-node.svg" alt="Nodo de Houdini Node Copypaster" data-i18n-alt="nodeAlt" width="640" height="340">
        <div class="card-body"><h2>Houdini Node Copypaster</h2><p data-i18n="cardDescription">Copia nodos y animación por Parsec.</p></div>
      </a>
      <a class="card tool" href="houdini-absolute-paths/">
        <img class="cover" src="assets/absolute-paths.svg" alt="Nodo de Houdini Absolute Paths" data-i18n-alt="absNodeAlt" width="640" height="340">
        <div class="card-body"><h2>Houdini Absolute Paths</h2><p data-i18n="absCardDescription">Convierte $HIP en rutas absolutas.</p></div>
      </a>
      <a class="card tool" href="focus/">
        <img class="cover" src="assets/focus.svg" alt="Cámara de Houdini enfocando un objeto" data-i18n-alt="fbAlt" width="640" height="340">
        <div class="card-body"><h2>Focus</h2><p data-i18n="fbCardDescription">Enfoca la cámara con un clic.</p></div>
      </a>
      <a class="card tool" href="rop-clean/">
        <img class="cover" src="assets/rop-clean.svg" alt="Un ROP de Houdini conectado a los nodos que usa; los que no usa, tachados" data-i18n-alt="rcAlt" width="640" height="340">
        <div class="card-body"><h2>ROP Clean</h2><p data-i18n="rcCardDescription">Deja solo lo que usan tus ROPs.</p></div>
      </a>
      <div class="card empty" data-i18n="empty">Vacío</div>
      <div class="card empty" data-i18n="empty">Vacío</div>
    </div>
  </main>
</body>
</html>
