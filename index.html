<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apoxia Toolkit</title>
  <style>
    :root {
      --bg: #f5f5f2;
      --card: #ffffff;
      --text: #1c1c1a;
      --muted: #6f6f68;
      --border: #dcdcd5;
      --accent: #2f6fed;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #131417;
        --card: #1c1e23;
        --text: #ececea;
        --muted: #9a9ca3;
        --border: #2e3138;
        --accent: #7aa5ff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 48px 16px 64px;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 2rem;
      letter-spacing: -0.02em;
    }
    .subtitle {
      margin: 0 0 32px;
      color: var(--muted);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }
    .card {
      display: block;
      min-height: 120px;
      padding: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: inherit;
      text-decoration: none;
      transition: border-color 0.15s, transform 0.15s;
    }
    a.card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .card h2 {
      margin: 0 0 6px;
      font-size: 1.05rem;
    }
    .card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .card.empty {
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border-style: dashed;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Apoxia Toolkit</h1>
    <p class="subtitle">Mis herramientas de uso diario.</p>

    <div class="grid">
      <!--
        Para añadir una herramienta, sustituye un cuadro vacío por esto:

        <a class="card" href="carpeta-o-enlace/">
          <h2>Nombre</h2>
          <p>Descripción corta.</p>
        </a>
      -->
      <div class="card empty">Vacío</div>
      <div class="card empty">Vacío</div>
      <div class="card empty">Vacío</div>
      <div class="card empty">Vacío</div>
      <div class="card empty">Vacío</div>
      <div class="card empty">Vacío</div>
    </div>
  </main>
</body>
</html>
